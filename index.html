<!doctype html>
<html lang="pt-BR" class="dark" style="background-color: #000000; color: #ffffff; margin: 0; padding: 0;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastPlayer Pro - Digital Signage OS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
    <style>
      html, body {
        background-color: #000000 !important;
        color: #ffffff;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      #root {
        background-color: #000000;
        min-height: 100vh;
        width: 100%;
      }
      @keyframes fastplayer-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body style="background-color: #000000; color: #ffffff; margin: 0; padding: 0;">
    <div id="root">
      <div style="background-color: #000000; color: #ffffff; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Inter, sans-serif;">
        <div style="width: 44px; height: 44px; border: 4px solid #1e293b; border-top-color: #2563eb; border-radius: 50%; animation: fastplayer-spin 1s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 16px; font-weight: 700; letter-spacing: 0.5px; color: #f8fafc;">FAST<span style="color: #3b82f6;">PLAYER</span></div>
        <div style="font-size: 12px; color: #64748b; margin-top: 6px;">Carregando sistema de exibição...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
